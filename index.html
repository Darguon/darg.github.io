<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Who is?</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playwrite+AU+SA:wght@100..400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>
<body>
    <!-- Enter Screen -->
    <div id="enter-screen">
        <div id="enter-text">Click To Enter...</div>
    </div>

    <!-- Background Video -->
    <video autoplay muted loop id="myVideo" style="display:none;">
        <source src="assets/videos/rain.mp4" type="video/mp4">
        Your browser does not support HTML5 video.
    </video>

    <!-- Spotify Player Container -->
    <div id="spotify-player" class="spotify-container hologram" style="position: fixed; top: 20px; right: 20px; z-index: 999; width: 300px; display: block; background-color: rgba(0, 0, 0, 0.8); padding: 10px; border-radius: 10px; box-shadow: 0 0 20px 5px rgba(131, 6, 6, 0.5);">
        <!-- Spotify iframe will be injected by JavaScript -->
    </div>



    <!-- Profile Component -->
    <div id="profile" style="display:none;" class="profile-3d">
        <div class="flip-container">
            <div class="flipper">
                <div class="front">
                    <img src="assets/images/dark.gif" alt="Profile Picture" id="profile-pic">
                </div>
                <div class="back">
                    20810
                </div>
            </div>
        </div>
        <div id="profile-name" class="glitch-effect" data-text="Darg">
            Darg
            <span class="tooltip-text"></span>
        </div>
        <div class="social-icons">
            <a href="discord://-/users/1229006135596683324" target="_blank">
                <img src="assets/images/discord.png" alt="Discord Icon" class="icon floating-icon" id="discord-icon">
            </a>
            <a href="#" target="_blank">
                <img src="assets/images/github.png" alt="GitHub Icon" class="icon floating-icon" id="github-icon">
            </a>
        </div>
    </div>

    <!-- Spotify Player will be injected by JavaScript -->

    <!-- Control Buttons -->
    <div id="controls-container" style="display: none;">
        <button id="change-background" class="control-button">Change Background</button>
        <button id="theme-toggle" class="control-button">Toggle Theme</button>
        <button id="effects-toggle" class="control-button">Toggle Effects</button>
        <button id="parallax-toggle" class="control-button">Toggle 3D Effects</button>
    </div>

    <!-- Visual Effects -->
    <div class="scanlines"></div>
    <div class="vignette"></div>
    <div class="rain" id="rain-effect"></div>

    <!-- About Section -->
    <div id="about-section" class="hologram">
        <button id="about-toggle">Show About</button>
        <div id="about-content">
            <p>Coming Soon!</p>
        </div>
    </div>

    <!-- Main script that imports all modules -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
