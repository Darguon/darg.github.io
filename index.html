<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>@darg | Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="min-h-screen bg-gradient flex items-center justify-center relative">
<!-- Click to Enter Overlay -->
<div id="enter-overlay" class="fixed inset-0 z-[100] bg-black bg-opacity-90 flex items-center justify-center backdrop-blur-sm cursor-pointer">
    <div class="text-center">
        <h2 class="text-2xl font-light text-white mb-2 opacity-80">click to enter</h2>
        <div class="w-12 h-[1px] bg-white opacity-30 mx-auto"></div>
    </div>
</div>

<!-- Animated Particles -->
<div id="particles" class="absolute inset-0 z-0"></div>

<!-- Volume Control -->
<div class="volume-control-container fixed top-6 left-6 z-50">
    <div class="volume-control">
        <div class="volume-icon">
            <svg class="w-6 h-6 text-white" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M9.383 3.076A1 1 0 0110 4v12a1 1 0 01-1.617.82L4.38 13H2a1 1 0 01-1-1V8a1 1 0 011-1h2.38l4.003-3.82a1 1 0 011-.104zM14.657 2.929a1 1 0 011.414 0A9.972 9.972 0 0119 10a9.972 9.972 0 01-2.929 7.071 1 1 0 01-1.414-1.414A7.971 7.971 0 0017 10c0-2.21-.894-4.208-2.343-5.657a1 1 0 010-1.414zm-2.829 2.828a1 1 0 011.415 0A5.983 5.983 0 0115 10a5.983 5.983 0 01-1.757 4.243 1 1 0 01-1.415-1.414A3.983 3.983 0 0013 10a3.983 3.983 0 00-1.172-2.829 1 1 0 010-1.414z" clip-rule="evenodd"></path>
            </svg>
        </div>
        <div class="volume-slider">
            <input type="range" min="0" max="100" value="50" class="slider">
        </div>
    </div>
</div>

<!-- Visitor Counter -->
<div class="visitor-counter fixed top-6 right-6 z-50 rounded-lg px-4 py-2">
    <div class="text-white text-sm font-medium text-center">
        <span id="visitor-count" class="glow">1337</span>
        <div class="text-xs text-gray-400 opacity-60 mt-1 font-light">visitors</div>
    </div>
</div>

<!-- Main Content -->
<div class="relative z-10 text-center">
    <!-- Avatar -->
    <div class="avatar-container mb-8 mx-auto w-32 h-32 relative">
        <div class="avatar-glow"></div>
        <div class="relative w-full h-full rounded-full bg-gradient-to-br from-blue-500 to-purple-600 p-1">
            <div class="w-full h-full rounded-full bg-gray-800 flex items-center justify-center text-4xl font-bold text-white">
                D
            </div>
        </div>
    </div>

    <!-- Name -->
    <h1 class="text-6xl font-bold text-white mb-8 glow">
        darg
    </h1>

    <!-- Social Links -->

        <!-- Discord -->

    </div>

    <!-- Description -->
    <p class="text-gray-300 text-lg max-w-md mx-auto">
        Developer • Creator • Dreamer

</div>

<script src="script.js"></script>

</html>
