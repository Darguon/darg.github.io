<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Who is?</title>
     <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playwrite+AU+SA:wght@100..400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Enter Screen -->
   <div id="enter-screen">
     <div id="enter-text">Click To Enter...</div>
   </div>

   <!-- The video -->
   <video autoplay muted loop id="myVideo" style="display:none;">
     <source src="rain.mp4" type="video/mp4">
     Your browser does not support HTML5 video.
  </video>

    <!-- Background music -->
    <audio id="background-music" loop>
        <source src="music.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <!-- Profile Picture and Name -->
   <div id="profile" style="display:none;">
        <img src="dark.gif" alt="Profile Picture" id="profile-pic">
        <div id="profile-name">
            Darg
            <span class="tooltip-text">Yes! That's my name!</span>
       </div>
        <a href="discord://-/users/1229006135596683324" target="_blank">
           <img src="discord.png" alt="Discord Icon" class="icon" id="discord-icon">
        </a>
    </div>

     <!-- Pause Button -->
   <div id="pause-button" class="btn btn-white btn-animated tooltip" style="display:none;">
        <svg id="pause-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="40" height="40">
          <path fill="white" d="M4 4h4v16H4V4zm12 0h4v16h-4V4z"/>
       </svg>
       <span class="tooltiptext">Pause/Play</span>
   </div>

     <!-- Song Info -->
    <div id="song-info" class="tooltip" style="display:none;">
        <h2 >
            Now Playing: SEREBRO - Сладко
            <span class="tooltiptext">Click to Switch Songs</span>
        </h2>
       <div class="slider-container">
            <div class="slider" id="song-slider"></div>
            <div class="slider-dot" id="song-slider-dot"></div>
        </div>
         <div class="time">
            <span id="current-time">0:00</span>
            <span>3:57</span>
       </div>
        <div class="volume-container tooltip">
            <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="1">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="20" height="20" id="volume-icon">
            <path d="M219.2 147.5c-16.5-16.5-16.5-43.2 0-59.7 14.2-14.2 36.4-15.4 52-.9l72.6 61.9H424c13.3 0 24 10.7 24 24v218c0 13.3-10.7 24-24 24H343.9l-72.6 61.9c-15.6 14.4-37.7 13.2-52-.9-16.5-16.5-16.5-43.2 0-59.7l42.9-42.9-42.9-42.9zm236.7 169.2c-8.4 8.4-20.1 8.4-28.5 0-11.8-11.8-30.7-11.8-42.5 0-8.4 8.4-20.1 8.4-28.5 0-11.8-11.8-30.7-11.8-42.5 0-8.4 8.4-20.1 8.4-28.5 0 11.8-11.8 30.7-11.8 42.5 0 8.4 8.4 20.1 8.4 28.5 0 11.8 11.8 30.7 11.8 42.5 0z"/>
            </svg>
           <span class="tooltiptext">Volume Control</span>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
