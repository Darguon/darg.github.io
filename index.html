<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Who is?</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playwrite+AU+SA:wght@100..400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>
<body>
    <!-- Enter Screen -->
    <div id="enter-screen">
        <div id="enter-text">Click To Enter...</div>
    </div>

    <!-- The video -->
    <video autoplay muted loop id="myVideo" style="display:none;">
        <source src="rain.mp4" type="video/mp4">
        Your browser does not support HTML5 video.
    </video>

    <!-- Background music -->
    <audio id="background-music" loop>
        <source src="music.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <!-- Profile Picture and Name -->
    <div id="profile" style="display:none;" class="profile-3d">
        <div class="flip-container">
            <div class="flipper">
                <div class="front">
                    <img src="dark.gif" alt="Profile Picture" id="profile-pic">
                </div>
                <div class="back">
                    20810
                </div>
            </div>
        </div>
        <div id="profile-name" class="glitch-effect" data-text="Darg">
            Darg
            <span class="tooltip-text">Yes! That's my name!</span>
        </div>
        <div class="social-icons">
            <a href="discord://-/users/1229006135596683324" target="_blank">
                <img src="discord.png" alt="Discord Icon" class="icon floating-icon" id="discord-icon">
            </a>
            <a href="#" target="_blank">
                <img src="github.png" alt="GitHub Icon" class="icon floating-icon" id="github-icon">
            </a>
        </div>
    </div>

    <!-- Song Info -->
    <div id="song-info" class="tooltip hologram" style="display:none;">
        <h2>
            Now Playing: Sigue - (Slowed + Reverb)
            <span class="tooltiptext">Click to Switch Songs</span>
        </h2>
        <div class="slider-container">
            <div class="slider" id="song-slider"></div>
            <div class="slider-dot" id="song-slider-dot"></div>
        </div>
        <div class="time">
            <span id="current-time">0:00</span>
            <span>3:57</span>
        </div>
        <div class="song-controls">
            <button id="prev-song" class="song-control-btn">
                <span class="material-symbols-outlined">skip_previous</span>
            </button>
            <!-- Pause Button -->
            <div id="pause-button" class="song-control-btn tooltip" style="display:none;">
                <svg id="pause-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="30" height="30">
                    <path fill="white" d="M4 4h4v16H4V4zm12 0h4v16h-4V4z"/>
                </svg>
                <span class="tooltiptext">Pause/Play</span>
            </div>
            <button id="next-song" class="song-control-btn">
                <span class="material-symbols-outlined">skip_next</span>
            </button>
        </div>
        <div class="volume-container tooltip">
            <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="1">
            <img src="volumeon.svg" alt="Volume Icon" id="volume-icon" width="20" height="20">
            <span class="tooltiptext">Volume Control</span>
        </div>
    </div>

    <!-- Additional Controls -->
    <div id="controls-container">
        <button id="change-background" class="control-button">Change Background</button>
        <button id="theme-toggle" class="control-button">Toggle Theme</button>
        <button id="effects-toggle" class="control-button">Toggle Effects</button>
    </div>

    <!-- Visual Effects -->
    <div class="scanlines"></div>
    <div class="vignette"></div>
    <div class="rain" id="rain-effect"></div>

    <!-- About Section -->
    <div id="about-section" class="hologram">
        <button id="about-toggle">Show About</button>
        <div id="about-content">
            <p>Coming Soon!</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
